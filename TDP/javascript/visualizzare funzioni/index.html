<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizzatore di funzioni</title>
    <script src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        body { font-family: sans-serif; padding: 1rem; }
        #controls label { margin-right: 1rem; }
        #controls input, #controls select { width: 80px; }
        #function-params label { margin-right: 1rem; }
        #function-params input { width: 80px; }
        #message { color: red; min-height: 1.2rem; margin: 0.5rem 0; }
        #curve_chart { width: 900px; height: 500px; }
    </style>
</head>
<body>

    <div id="controls">
        <label>Funzione
            <select id="function-select" name="function">
                <option value="lineare">Retta</option>
                <option value="parabola">Parabola</option>
            </select>
        </label>
        <label>x min
            <input id="x-min" type="number" value="-10" step="1" />
        </label>
        <label>x max
            <input id="x-max" type="number" value="10" step="1" />
        </label>
        <label>passo
            <input id="x-step" type="number" value="1" step="0.1" min="0.1" />
        </label>
    </div>

    <div id="function-params"></div>
    <p id="message"></p>
    <div id="curve_chart"></div>

    <script src="./app.js"></script>
</body>
</html>
